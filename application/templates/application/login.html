<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shree Guru Kumareshwar Dharmik Pathshala</title>
    <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #D4611A;
            --deep-saffron: #A8400A;
            --gold: #C8922A;
            --light-gold: #F0D080;
            --cream: #FBF5E6;
            --dark-brown: #2A1A0A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #1A0E04 0%, #2A1A0A 100%);
            min-height: 100vh;
            font-family: 'Crimson Pro', Georgia, serif;
            color: var(--dark-brown);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: linear-gradient(160deg, #FBF5E6 0%, #FFF3D0 100%);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .om-symbol {
            font-size: 48px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Yatra One', sans-serif;
            font-size: 1.8rem;
            color: var(--deep-saffron);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--gold);
            font-style: italic;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark-brown);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #C8922A66;
            border-radius: 4px;
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            color: var(--dark-brown);
            background: #FFF8EC;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--saffron);
            box-shadow: 0 0 0 3px #D4611A18;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--deep-saffron) 0%, var(--saffron) 50%, var(--gold) 100%);
            border: none;
            border-radius: 4px;
            color: #FFF8EC;
            font-family: 'Yatra One', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px #D4611A55;
        }

        .messages {
            margin-bottom: 24px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .alert-error {
            background: #FFE5E5;
            color: #C00;
            border: 1px solid #FFB3B3;
        }

        .alert-success {
            background: #E5F5E5;
            color: #0C0;
            border: 1px solid #B3FFB3;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--gold);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="om-symbol">ॐ</div>
            <h1>Shree Guru Kumareshwar</h1>
            <div class="subtitle">Dharmik Pathshala Management System</div>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="footer-text">
            विद्या ददाति विनयम्<br>
            Knowledge bestows humility.
        </div>
    </div>
</body>
</html>
